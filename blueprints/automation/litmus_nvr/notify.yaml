blueprint:
  name: Litmus NVR alert notification
  description: >-
    Send a phone notification with the snapshot when a Litmus NVR alert goes off.
    The picture opens without a Home Assistant login (signed link). It stays available for up to 7 days,
    for the latest 200 alerts, until Litmus NVR restarts.
  domain: automation
  source_url: https://github.com/grablo/litmus-hass-integration/blob/main/blueprints/automation/litmus_nvr/notify.yaml
  input:
    alert_event:
      name: Alert
      selector:
        entity:
          filter:
            - integration: litmus_nvr
              domain: event
    notify_device:
      name: Phone
      selector:
        device:
          filter:
            - integration: mobile_app
    kinds:
      name: Alert kinds (empty = all)
      default: []
      selector:
        select:
          multiple: true
          options:
            - person
            - face_known
            - face_unknown
            - face_specific
            - vehicle_any
            - vehicle_known
            - vehicle_unknown
            - vehicle_specific
            - animal_any
            - animal_specific
            - text_person
            - text_vehicle
            - text_animal
            - sound

mode: parallel
max: 10

triggers:
  - trigger: state
    entity_id: !input alert_event

variables:
  kinds: !input kinds
  notify_device: !input notify_device
  attrs: "{{ trigger.to_state.attributes }}"

conditions:
  - "{{ trigger.to_state.state not in ['unknown', 'unavailable'] }}"
  # An event entity comes back from 'unavailable' with its last timestamp restored — that is not a new alert
  # (HA core helpers/trigger/entity_trigger.py excludes STATE_UNAVAILABLE for the same reason).
  - "{{ trigger.from_state is not none and trigger.from_state.state != 'unavailable' }}"
  - "{{ kinds | length == 0 or attrs.event_type in kinds }}"

actions:
  # Alerts without a picture (sound) must not send an image URL — a missing attribute would render as the text "None".
  - if:
      - "{{ attrs.snapshot is string and attrs.snapshot | length > 0 }}"
    then:
      - action: "notify.mobile_app_{{ device_attr(notify_device, 'name') | slugify }}"
        data:
          title: "{{ attrs.title or state_attr(trigger.entity_id, 'friendly_name') }}"
          message: "{{ attrs.message or attrs.event_type }}"
          data:
            image: "{{ attrs.snapshot }}"
            attachment:
              url: "{{ attrs.snapshot }}"
              content-type: jpeg
            tag: "{{ attrs.event_id }}"
            group: "litmus-nvr"
    else:
      - action: "notify.mobile_app_{{ device_attr(notify_device, 'name') | slugify }}"
        data:
          title: "{{ attrs.title or state_attr(trigger.entity_id, 'friendly_name') }}"
          message: "{{ attrs.message or attrs.event_type }}"
          data:
            tag: "{{ attrs.event_id }}"
            group: "litmus-nvr"
